[project]
name = "portefeuille-minutes"
version = "0.1.0"
description = "Intégration Home Assistant : portefeuille de minutes de temps d'écran selon les notes scolaires"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",  # apporte pytest et homeassistant, versions épinglées
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
markers = [
    "requirement(name): exigence de la spec OpenSpec vérifiée par le test, au format '<capability>/<nom de l'exigence>'",
]
